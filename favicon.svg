<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Same mark as the sidebar brand: a filled disc with a d20 silhouette
       knocked out of it. Follows the page theme where the browser supports it. -->
  <style>
    .disc { fill: #7a1f1f; }
    @media (prefers-color-scheme: dark) { .disc { fill: #22c55e; } }
  </style>
  <mask id="d20Knockout">
    <rect width="40" height="40" fill="#fff"/>
    <polygon points="20,6 32.1,13 32.1,27 20,34 7.9,27 7.9,13"
             fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  </mask>
  <circle class="disc" cx="20" cy="20" r="19" mask="url(#d20Knockout)"/>
</svg>
