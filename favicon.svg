<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The d20 silhouette on a transparent background, so the tab strip shows
       through around the mark instead of a filled disc. Drawn larger than the
       sidebar brand's knockout, since there is no disc to sit inside, and with
       a heavier stroke so it still reads at 16px. Follows the page theme where
       the browser supports it. -->
  <style>
    .mark { stroke: #7a1f1f; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #22c55e; } }
  </style>
  <polygon class="mark" points="20,2 35.6,11 35.6,29 20,38 4.4,29 4.4,11"
           fill="none" stroke-width="4" stroke-linejoin="round"/>
</svg>
